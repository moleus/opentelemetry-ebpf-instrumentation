name: OBI agent fuzz tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/obi-agent/**'
      - 'pkg/internal/ebpf/kafkaparser/**'
      - 'pkg/internal/largebuf/**'
      - '.github/workflows/obi-agent-quality-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obi-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Kafka property fuzz
        run: go test ./pkg/internal/ebpf/kafkaparser -run '^$' -fuzz '^FuzzKafkaChunkBoundaryInvariant$' -fuzztime=10s -parallel=2

      - name: LargeBuffer property fuzz
        run: go test ./pkg/internal/largebuf -run '^$' -fuzz '^FuzzLargeBufferLimitAndChunking$' -fuzztime=10s -parallel=2

      - name: Limiter budget fuzz
        run: go test ./cmd/obi-agent/internal/sampler -run '^$' -fuzz '^FuzzLimiterBudget$' -fuzztime=10s -parallel=2
