---
# Builds the obi-agent image (Dockerfile with CMD=obi-agent) on native amd64 and arm64 runners and pushes
# one multi-arch tag to GHCR: <registry>/obi-agent:<short sha>, plus the branch name.
name: obi-agent-image
on:
  workflow_dispatch:
  push:
    branches: ['obi-agent']
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/obi-agent

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux/amd64, runner: ubuntu-latest, arch: amd64}
          - {platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}-${{ matrix.arch }}
          build-args: |
            CMD=obi-agent
            RELEASE_VERSION=${{ steps.sha.outputs.short }}
            RELEASE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=obi-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=obi-agent-${{ matrix.arch }}

  manifest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Multi-arch tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eux
          SHORT="${GITHUB_SHA::9}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHORT}" --tag "${IMAGE}:${BRANCH//\//-}" \
            "${IMAGE}:${SHORT}-amd64" "${IMAGE}:${SHORT}-arm64"
          echo "Pushed ${IMAGE}:${SHORT}" >> "$GITHUB_STEP_SUMMARY"
